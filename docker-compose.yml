version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: deals-app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    networks:
      - deals-net

  postgres:
    image: postgres:15
    container_name: deals-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - deals-net

  redis:
    image: redis:7
    container_name: deals-redis

    ports:
      - "6379:6379"

    networks:
      - deals-net

networks:
  deals-net:

volumes:
  postgres_data: