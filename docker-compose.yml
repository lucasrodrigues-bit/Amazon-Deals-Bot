services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: deals-app
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "python -c 'import amazon_deals_bot' && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - deals-net

  postgres:
    image: postgres:15
    container_name: deals-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - deals-net

  redis:
    image: redis:7
    container_name: deals-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - deals-net

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: deals-evolution
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      SERVER_URL: http://localhost:8081
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

    volumes:
      - evolution_data:/evolution/instances

    networks:
      - deals-net

networks:
  deals-net:

volumes:
  postgres_data:
  evolution_data:
